<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
      :root {
  --card-height:  65vh;
  --card-width:   calc(var(--card-height) / 1.5);
  --bg:           25 28 41;
  --color:        88 199 250;
}

  body {
   min-height: 100vh;
    background: rgba(var(--bg) / 90%);
    display: flex;
    align-items: center;
    flex-direction: column;
    padding-top: 2rem;
    padding-bottom: 2rem;
    box-sizing: border-box;
    font-family: Roboto;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #ff7ac8;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
  }

  .card {
    background: rgba(25,28,41, 0.8);
    /* backdrop-filter: blur(10px); */
    width: var(--card-width);
    height: var(--card-height);
    padding: 30px;
    position: relative;
    border-radius: 6px;
    color: rgba(var(--color) / 80%);
    cursor: pointer;
    text-align: center;
    margin-top: 30px;
  }

  .card::before {
      content: "";
    width: 104%;
    height: 102.7%;
    border-radius: 8px;
    background-image: linear-gradient(
      var(--rotate),
      #5ddcff,
      #3c67e3 43%,
      #4e00c2
    );
    position: absolute;
    z-index: -1;
    top: -1.3%;
    left: -2%;
    animation: spin 2.5s linear infinite;
  }

  .card::after {
   position: absolute;
    content: "";
    top: calc(var(--card-height) / 6);
    left: 0;
    right: 0;
    z-index: -1;
    height: 100%;
    width: 100%;
    margin: 0 auto;
    transform: scale(0.8);
    filter: blur(calc(var(--card-height) / 6));
    background-image: linear-gradient(
      var(--rotate),
      #5ddcff,
      #3c67e3 43%,
      #4e00c2
    );
    opacity: 1;
    transition: opacity 0.5s;
    animation: spin 2.5s linear infinite;
  }
  .card:hover:before,
.card:hover:after {
    animation: none;
    opacity: 0;
 }

  @keyframes spin {
    0% { --rotate: 0deg; }
    100% { --rotate: 360deg; }
  }

  @property --rotate {
    syntax: "<angle>";
    initial-value: 132deg;
    inherits: false;
  }

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  width: 100%;
  max-width: 900px;
  margin: 10px auto;
}

.gallery img {
  width: 100%;
  height: 100%; /* Increased height for better visibility */
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
  transition: transform 0.3s, box-shadow 0.3s;
}

        .grid-item {
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  overflow: hidden;
}

  .gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
  }

  /* placeholder for missing image */
  .placeholder {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #fff;
    font-style: italic;
  }

  .message {
    margin-top: 15px;
    font-size: 1.1rem;
    line-height: 1.6;
    color: #f8dfff;
  }

</style>
</head>
<body>

  <h1>🎉 Happy Birthday Jaan 🎂 <br> click the photos to see them</h1>
  <div class="card">
  <div class="gallery">
  <div class="grid-item"><a href="1.jpg"><img src="1.jpg" alt="Birthday image 1"></a></div>  <!-- cell 1 -->
  <div class="grid-item"></div>                                           <!-- cell 2 empty -->
  <div class="grid-item"><a href="2.jpg"><img src="2.jpg" alt="Birthday image 2"></a></div>  <!-- cell 3 -->
  <div class="grid-item"><img src="Love u.jpeg" alt="Birthday image 3"></div>                                           <!-- cell 4 empty -->
  <div class="grid-item"><a href="4.jpg"><img src="4.jpg" alt="Birthday image 3"></a></div>  <!-- cell 5 -->
  <div class="grid-item"><img src="Forever.jpeg" alt="Birthday image 3"></div>                                           <!-- cell 6 empty -->
  <div class="grid-item"><a href="3.jpg"><img src="3.jpg" alt="Birthday image 4"></a></div>  <!-- cell 7 -->
  <div class="grid-item"></div>                                           <!-- cell 8 empty -->
  <div class="grid-item"><a href="5.jpg"><img src="5.jpg" alt="Birthday image 5"></a></div>  <!-- cell 9 -->
</div>



  </div>

</body>
</html>
