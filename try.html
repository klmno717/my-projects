<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  :root {
    --card-height: 80vh;
    --card-width: calc(var(--card-height) / 1.2);
    --bg: 25 28 41;
    --color: 255 105 180; /* pink glow */
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1c1f2b, #3a1c5d);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    color: white;
    text-align: center;
    padding: 1rem;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #ff7ac8;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
  }

  .card {
    background: rgba(25, 28, 41, 0.85);
    width: var(--card-width);
    height: var(--card-height);
    padding: 20px;
    position: relative;
    border-radius: 12px;
    overflow-y: auto;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
  }

  .card::before {
    content: "";
    width: 104%;
    height: 102%;
    border-radius: 12px;
    background-image: linear-gradient(
      var(--rotate),
      #ff7ac8,
      #ffcc70 43%,
      #ff8b00
    );
    position: absolute;
    z-index: -1;
    top: -1%;
    left: -2%;
    animation: spin 3s linear infinite;
  }

  .card::after {
    position: absolute;
    content: "";
    top: calc(var(--card-height) / 6);
    left: 0;
    right: 0;
    z-index: -1;
    height: 100%;
    width: 100%;
    margin: 0 auto;
    transform: scale(0.8);
    filter: blur(calc(var(--card-height) / 6));
    background-image: linear-gradient(
      var(--rotate),
      #ff7ac8,
      #ffcc70 43%,
      #ff8b00
    );
    opacity: 1;
    transition: opacity 0.5s;
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    0% { --rotate: 0deg; }
    100% { --rotate: 360deg; }
  }

  @property --rotate {
    syntax: "<angle>";
    initial-value: 132deg;
    inherits: false;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }

  .gallery img {
    width: 100%;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
  }

  /* placeholder for missing image */
  .placeholder {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #fff;
    font-style: italic;
  }

  .message {
    margin-top: 15px;
    font-size: 1.1rem;
    line-height: 1.6;
    color: #f8dfff;
  }

</style>
</head>
<body>

  <h1>🎉 Happy Birthday Jaan 🎂</h1>
  <div class="card">
    <div class="gallery">
      <img src="1.jpg" alt="Birthday image 1">
      <img src="2.jpg" alt="Birthday image 2">
      <img src="3.jpg" alt="Birthday image 3">
      <img src="4.jpg" alt="Birthday image 4">
      <div class="placeholder">Your special photo here 💖</div>
    </div>

    <p class="message">
      Wishing you a day filled with love, laughter, and sweet memories.  
      You make the world brighter just by being in it. 🌟  
      May your birthday be as beautiful and special as you are! 💐
    </p>
  </div>

</body>
</html>
