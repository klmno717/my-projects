<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
              background-size: cover;
            width: 100%;
            height: 100%;
            max-width: 6000px;
            max-height: 6000px;
    }

    .container {
      body {
    
    background-image: url("ChatGPT Image Nov 8, 2025, 11_28_04 PM.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed; 
}

      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

    .content {
      font-family: sans-serif;
      position: absolute;
      left: 50%;
      bottom: 20%;
      transform: translateX(-50%);
      background-color: transparent;
      -webkit-text-stroke-color: white;
      text-align: center;
      padding: 0 10px;
    }

    .content h1 {
      font-size: 3rem;
      margin: 0;
    }

    .content p {
      font-size: 1.2rem;
    }

    .btn {
      background: transparent;
      padding: 15px 40px;
      border: none;
      outline: 1px solid blue;
      cursor: pointer;
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%) scale(2.5);
      z-index: 1;
      border-radius: 22px;
    }

    .btn a {
      color: inherit;
      text-decoration: none;
    }

    .btn::after {
      content: "";
      z-index: -1;
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      border-radius: 10px;
    }

    .btn::before {
      content: "";
      background: linear-gradient(
        45deg,
        #ff0000,
        #ff7300,
        #fffb00,
        #48ff00,
        #00ffd5,
        #002bff,
        #ff00c8,
        #ff0000
      );
      position: absolute;
      top: -2px;
      left: -2px;
      background-size: 600%;
      z-index: -1;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      filter: blur(8px);
      animation: glowing 20s linear infinite;
      transition: opacity 0.3s ease-in-out;
      border-radius: 10px;
      opacity: 0;
    }

    @keyframes glowing {
      0% {
        background-position: 0 0;
      }
      50% {
        background-position: 400% 0;
      }
      100% {
        background-position: 0 0;
      }
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:active:after {
      background: transparent;
    }

    .btn:active {
      color: #000;
      font-weight: bold;
    }

    /* ========== Responsive Media Queries ========== */

/* ===== Generic Tablets (portrait and landscape, <1280px wide) ===== */
@media (max-width: 1280px) and (min-width: 600px), (min-device-width: 600px) and (max-device-width: 1280px) {
  * {
  box-sizing: border-box;
}
      .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

  .content h1 {
    font-size: 2.3rem;
  }
  .content p {
    font-size: 1rem;
  }
  .btn {
    transform: translateX(-50%) scale(2);
    padding: 12px 34px;
  }
}

/* ===== Large Smartphones & Foldables (max-width: 950px) ===== */
@media (max-width: 950px) and (max-device-height: 1280px), (min-device-width: 360px) and (max-device-width: 950px) {
  * {
  box-sizing: border-box;
}
      .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

  .content h1 {
    font-size: 1.5rem;
  }
  .content p {
    font-size: 0.86rem;
  }
  .btn {
    transform: translateX(-50%) scale(1.3);
    padding: 9px 20px;
  }
}

/* ===== Small Smartphones (max-width: 480px) ===== */
@media (max-width: 480px), (min-device-width: 320px) and (max-device-width: 480px) {
  * {
  box-sizing: border-box;
}
      .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

  .content h1 {
    font-size: 1.15rem;
  }
  .content p {
    font-size: 0.7rem;
  }
  .btn {
    transform: translateX(-50%) scale(1);
    padding: 7px 16px;
  }
}

/* ===== High Pixel Density Devices (Samsung, Vivo, often DPR≥2) ===== */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
  * {
  box-sizing: border-box;
}
      .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

  body {
    font-size: 1rem;
  }
  .content h1 {
    font-size: 1.2rem;
  }
}

/* ===== Landscape Orientation (tablets, some Samsung Fold, Vivo X Fold) ===== */
@media (orientation: landscape) and (max-width: 1280px) {
  * {
  box-sizing: border-box;
}
      .container spline-viewer {
      position: absolute;
      bottom: 0;
      transform: scale(1.1);
      width: 100%;
      height: 100%;
    }

  .content h1 {
    font-size: 2rem;
  }
  .content p {
    font-size: 1rem;
  }
  .btn {
    padding: 10px 28px;
  }
}

  </style>
</head>

  <div class="logo">
  <div class="container">
    <div class="content">
      <h1>Hello There <br />Welcome to my page</h1>
      <p>this page is dedicated to u <br /> Jaan ❤️! </p>
    </div>
  </div>
  <button class="btn"><a href="index2.html">Click Me!</a></button>
</body>
</html>
